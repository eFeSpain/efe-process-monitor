name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt (must be clean)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race is the point of this step: the settings toggles are read by
      # background goroutines and written by HTTP handlers, and a plain `go test`
      # cannot see that class of bug.
      - name: go test (race)
        run: go test -race ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      # gosec, with exclusions scoped to the files where a rule is structurally
      # unavoidable for this kind of tool — never globally, so each rule stays
      # live everywhere else:
      #   audit.go   reads system config files by design (/etc/crontab, sudoers,
      #              ~/.bashrc, /sys/...) from hardcoded lists → G304, G703.
      #   lan.go     same, for the OUI/ARP helpers → G304.
      #   proc.go    the single exec wrapper every subprocess goes through; all
      #              call sites use a fixed binary name and validated args, and
      #              nothing runs via a shell → G204, G702.
      #   tools/     build-time asset generators, not part of the shipped binary.
      # G101 is excluded globally: it is a lexical match on identifiers such as
      # auth_* / login_* / token in the translation maps, not a credential.
      - name: gosec
        uses: securego/gosec@master
        with:
          args: >-
            -exclude-generated
            -severity medium
            -exclude=G101
            -exclude-rules=audit\.go:G304,G703;lan\.go:G304;proc\.go:G204,G702;tools/.*:G115,G304,G306
            ./...

  build:
    # Guarantees the binary stays cgo-free and compiles on every target OS.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [windows/amd64, linux/amd64, darwin/amd64, linux/arm64, darwin/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.target }}
        run: |
          os=${{ matrix.target }}; arch=${os#*/}; os=${os%/*}
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o /dev/null .
