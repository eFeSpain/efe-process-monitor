name: Release

# Trigger by pushing a version tag, e.g.:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # needed to create the release and upload assets
  id-token: write      # OIDC token used to sign the provenance attestation
  attestations: write  # store the attestation against the repository

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # macOS is deliberately NOT shipped. The binary compiles for darwin (CI keeps
      # proving that), but several audit probes have no implementation there —
      # the process cross-view and the deleted-binary check — and shipping a
      # security tool that cannot run parts of its own audit invites the user to
      # read "not checked" as "clean". Anyone on a Mac can still build from source.
      - name: Build all platforms
        run: |
          mkdir -p dist
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            os=${t%/*}; arch=${t#*/}
            out="efemon-${os}-${arch}"
            ld="-s -w"
            if [ "$os" = "windows" ]; then
              out="${out}.exe"
              ld="$ld -H=windowsgui"   # no console window; runs in the tray
            fi
            echo "→ building $out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags="$ld" -o "dist/$out" .
          done
          ( cd dist && sha256sum * > checksums.txt )
          ls -la dist

      # Build provenance: a signed, verifiable statement of which workflow, from
      # which commit, produced these exact binaries. The checksums.txt alone only
      # proves the files agree with themselves — it says nothing about where they
      # came from. For a security tool people download and run elevated, "you can
      # check this really was built from this source" is the whole point.
      #
      # Verify a download with:
      #   gh attestation verify efemon-windows-amd64.exe --repo eFeSpain/efe-process-monitor
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/efemon-*

      # The release body is the tag's section of CHANGELOG.md. GitHub's own
      # generated notes are built from pull requests, and this repository commits
      # straight to main, so on their own they were just the compare link.
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md section for $v — add '## [$v] — <date>' before tagging" >&2
            exit 1
          fi
          printf '\n---\n**Verify a download**: `gh attestation verify <file> --repo %s`\n' "$GITHUB_REPOSITORY" >> RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true   # appended: contributors and the compare link
          prerelease: ${{ contains(github.ref_name, '-') }}   # v*-beta / -rc → marked as pre-release
